<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackeando o Algoritmo 3.2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 15px;}
        textarea { resize: vertical; }
        button { display: block; width: 100%; padding: 14px; background-color: #2980b9; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background-color: #3498db; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .progress-bar-container { width: 100%; background-color: #ecf0f1; border-radius: 5px; margin-bottom: 20px; height: 10px; overflow: hidden;}
        .progress-bar { height: 100%; background-color: #27ae60; transition: width 0.4s ease; }
        
        .hidden { display: none; }
        #mensagem-sucesso { text-align: center; color: #27ae60; padding: 30px; background: #eafaf1; border-radius: 5px;}
        
        .btn-secundario { background-color: #7f8c8d; margin-top: 10px; padding: 10px; font-size: 14px; }
        .btn-secundario:hover { background-color: #95a5a6; }
        
        .desc-box { background-color: #fdfefe; border-left: 4px solid #f39c12; padding: 15px; margin-bottom: 20px; border-radius: 4px; color: #555; white-space: pre-wrap; font-style: italic;}
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 Hackeando o Algoritmo</h1>
    
    <div id="tela-login">
        <p style="text-align:center;">Identifiquem a equipe. Se fecharem a aba, basta selecionar a fase de onde pararam.</p>
        
        <div class="form-group">
            <label>Nome do Grupo:</label>
            <input type="text" id="input-grupo" placeholder="Ex: Esquadrão Cyber">
        </div>
        <div class="form-group">
            <label>Nomes dos Integrantes:</label>
            <input type="text" id="input-integrantes" placeholder="João, Maria e Pedro">
        </div>
        <div class="form-group">
            <label>Qual fase vão fazer agora?</label>
            <select id="select-fase">
                <option value="1">Fase 1: Laboratório de Clickbait</option>
                <option value="2">Fase 2: Fact-Checking</option>
                <option value="3">Fase 3: Teste A/B</option>
                <option value="4">Fase 4: Auditoria da Bolha</option>
                <option value="5">Fase 5: Mapa da Toxicidade</option>
            </select>
        </div>
        <button id="btn-iniciar" onclick="iniciarOuRetomar()">Iniciar Missão</button>
    </div>

    <div id="tela-missao" class="hidden">
        <div class="progress-bar-container">
            <div id="barra-progresso" class="progress-bar" style="width: 20%;"></div>
        </div>
        
        <h2 id="titulo-missao">Fase</h2>
        <div id="desc-missao" class="desc-box"></div>
        <div id="campos-dinamicos"></div>
        
        <button id="btn-enviar" onclick="enviarDadosEAvancar()">Enviar e Avançar para a Próxima Fase</button>
        <button class="btn-secundario" onclick="voltarParaLogin()">Voltar / Editar Grupo</button>
    </div>

    <div id="mensagem-sucesso" class="hidden">
        <h2>🎉 Parabéns, Engenheiros!</h2>
        <p>Todas as missões foram concluídas e salvas no banco de dados.</p>
        <button onclick="limparEReiniciar()">Fazer nova análise (Outro Grupo)</button>
    </div>
</div>

<!-- O TRUQUE MESTRE: Um iframe escondido para receber a resposta do Google sem sair da página -->
<iframe name="iframe_oculto" id="iframe_oculto" style="display:none;"></iframe>

<!-- O Formulário Raiz que não sofre bloqueio do navegador -->
<form id="form_invisivel" method="POST" target="iframe_oculto" style="display:none;">
    <input type="hidden" name="grupo" id="form_grupo">
    <input type="hidden" name="integrantes" id="form_integrantes">
    <input type="hidden" name="fase" id="form_fase">
    <input type="hidden" name="resposta_1" id="form_r1">
    <input type="hidden" name="resposta_2" id="form_r2">
    <input type="hidden" name="resposta_3" id="form_r3">
    <input type="hidden" name="resposta_4" id="form_r4">
</form>

<script>
    // ⚠️ ATENÇÃO: COLE O SEU NOVO LINK AQUI DENTRO DAS ASPAS:
    var PLANILHA_URL = "https://script.google.com/macros/s/AKfycbzmbpfNj8REaYBC1Z-kuB7QVjQX2BoLFzvPHhIftdRvsaQ1xPuXPiXJWo4hkVrMu32yeA/exec";

    // Informa ao formulário para onde ele deve ir
    document.getElementById("form_invisivel").action = PLANILHA_URL;

    var configFases = {
        1: {
            titulo: "Fase 1: Laboratório de Clickbait",
            desc: "O TÍTULO CHATO ORIGINAL:\n'Aviso: A prefeitura recomenda beber mais água devido à baixa umidade do ar.'\n\nReescreva esse título e transforme-o no post mais apelativo e viral possível.",
            campos: [
                { label: "1. Qual o seu novo Título Clickbait?", linhas: 2 },
                { label: "2. Qual emoção tentaram engatilhar (Raiva, Medo, Curiosidade, Urgência)?", linhas: 1 },
                { label: "3. O que teria na Imagem/Vídeo para prender a atenção?", linhas: 2 }
            ]
        },
        2: {
            titulo: "Fase 2: Agência de Fact-Checking",
            desc: "CASO EM ANÁLISE: A 'Grávida de Taubaté' (2012).\nUma mulher usou uma barriga de espuma e foi à TV jurando estar grávida de quadrigêmeas. O Brasil inteiro acreditou.",
            campos: [
                { label: "1. Por que essa história viralizou tão rápido na época?", linhas: 2 },
                { label: "2. Qual tática de manipulação emocional foi usada para enganar as pessoas?", linhas: 2 },
                { label: "3. Se fosse hoje, como o algoritmo das redes iria agir com esse caso?", linhas: 2 }
            ]
        },
        3: {
            titulo: "Fase 3: Teste A/B",
            desc: "O TEMA: A Feira de Ciências da Escola que vai acontecer neste sábado.\n\nCriem duas versões de divulgação para competir pela atenção no algoritmo.",
            campos: [
                { label: "1. Texto do Post A (Versão Ética, Informativa e chata)", linhas: 3 },
                { label: "2. Texto do Post B (Versão Viral, Apelativa ou Clickbait)", linhas: 3 },
                { label: "3. Explique: Por que o Algoritmo impulsionaria o Post B?", linhas: 2 }
            ]
        },
        4: {
            titulo: "Fase 4: Auditoria da Bolha",
            desc: "MISSÃO: Abram o TikTok, Reels ou Shorts no celular de alguém. Rolem o feed e anotem os 10 primeiros posts que aparecerem.",
            campos: [
                { label: "1. Qual plataforma estão usando?", linhas: 1 },
                { label: "2. Liste o @ do criador e o Tema dos 10 primeiros posts.", linhas: 8 },
                { label: "3. Olhando a lista, qual perfil de interesses o algoritmo acha que o dono do celular tem?", linhas: 3 }
            ]
        },
        5: {
            titulo: "Fase 5: Mapa da Toxicidade",
            desc: "CENÁRIO EM UM DISCORD:\nUm novato entra para jogar, mas joga mal. Veteranos de uma 'panela' começam a xingá-lo e fazer figurinhas. O novato sai do jogo.",
            campos: [
                { label: "1. Qual foi o gatilho da toxicidade? Por que a 'panela' se sentiu à vontade?", linhas: 2 },
                { label: "2. Como as ferramentas do app (anonimato, reações rápidas) pioraram tudo?", linhas: 2 },
                { label: "3. Proponham 2 regras práticas no design do servidor para evitar isso.", linhas: 3 }
            ]
        }
    };

    var dadosAtuais = { grupo: "", integrantes: "", fase: 1 };

    window.onload = function() {
        if(localStorage.getItem('anatomia_grupo')) {
            document.getElementById('input-grupo').value = localStorage.getItem('anatomia_grupo');
            document.getElementById('input-integrantes').value = localStorage.getItem('anatomia_integrantes');
            var faseSalva = parseInt(localStorage.getItem('anatomia_fase'));
            if(faseSalva >= 1 && faseSalva <= 5) {
                document.getElementById('select-fase').value = faseSalva;
                document.getElementById('btn-iniciar').innerText = "Continuar da Fase " + faseSalva;
            } else if (faseSalva > 5) {
                document.getElementById('select-fase').value = 1;
            }
        }
    }

    function iniciarOuRetomar() {
        var grupo = document.getElementById("input-grupo").value.trim();
        var integrantes = document.getElementById("input-integrantes").value.trim();
        var faseSelecionada = parseInt(document.getElementById("select-fase").value);

        if(!grupo || !integrantes) {
            alert("⚠️ Preencha o nome do grupo e integrantes.");
            return;
        }

        dadosAtuais = { grupo: grupo, integrantes: integrantes, fase: faseSelecionada };
        localStorage.setItem('anatomia_grupo', grupo);
        localStorage.setItem('anatomia_integrantes', integrantes);
        localStorage.setItem('anatomia_fase', faseSelecionada);
        
        carregarInterfaceDaFase();
    }

    function carregarInterfaceDaFase() {
        document.getElementById("tela-login").classList.add("hidden");
        document.getElementById("tela-missao").classList.remove("hidden");
        
        var config = configFases[dadosAtuais.fase];
        document.getElementById("titulo-missao").innerText = config.titulo;
        document.getElementById("desc-missao").innerText = config.desc;
        document.getElementById("barra-progresso").style.width = (dadosAtuais.fase * 20) + "%";

        var btnEnviar = document.getElementById("btn-enviar");
        if(dadosAtuais.fase === 5) {
            btnEnviar.innerText = "Finalizar Missão e Enviar!";
            btnEnviar.style.backgroundColor = "#e67e22";
        } else {
            btnEnviar.innerText = "Enviar e Avançar para a Fase " + (dadosAtuais.fase + 1);
            btnEnviar.style.backgroundColor = "#2980b9";
        }
        btnEnviar.disabled = false;

        var containerCampos = document.getElementById("campos-dinamicos");
        containerCampos.innerHTML = "";
        
        config.campos.forEach(function(campo, index) {
            var htmlCampo = '<div class="form-group">' +
                            '<label>' + campo.label + '</label>' +
                            '<textarea id="resposta_' + (index + 1) + '" rows="' + campo.linhas + '" placeholder="Digite a resposta aqui..."></textarea>' +
                            '</div>';
            containerCampos.innerHTML += htmlCampo;
        });
    }

    // Pega o valor se o campo existir, senão retorna vazio
    function pegarValorSeguro(id) {
        var campo = document.getElementById(id);
        return campo ? campo.value : "";
    }

    function enviarDadosEAvancar() {
        var btn = document.getElementById("btn-enviar");
        btn.innerText = "Gravando na planilha... Aguarde";
        btn.disabled = true;
        
        // 1. Preenche os campos do formulário invisível com as respostas da tela
        document.getElementById("form_grupo").value = dadosAtuais.grupo;
        document.getElementById("form_integrantes").value = dadosAtuais.integrantes;
        document.getElementById("form_fase").value = configFases[dadosAtuais.fase].titulo;
        document.getElementById("form_r1").value = pegarValorSeguro("resposta_1");
        document.getElementById("form_r2").value = pegarValorSeguro("resposta_2");
        document.getElementById("form_r3").value = pegarValorSeguro("resposta_3");
        document.getElementById("form_r4").value = pegarValorSeguro("resposta_4");

        // 2. Dispara o envio real (como é formulário nativo, o navegador nunca bloqueia)
        document.getElementById("form_invisivel").submit();

        // 3. Aguarda 2 segundos para o Google processar e avança de fase
        setTimeout(function() {
            dadosAtuais.fase++;
            localStorage.setItem('anatomia_fase', dadosAtuais.fase);
            window.scrollTo(0, 0);

            if (dadosAtuais.fase > 5) {
                document.getElementById("tela-missao").classList.add("hidden");
                document.getElementById("mensagem-sucesso").classList.remove("hidden");
            } else {
                carregarInterfaceDaFase();
            }
        }, 2000);
    }

    function voltarParaLogin() {
        document.getElementById("tela-missao").classList.add("hidden");
        document.getElementById("tela-login").classList.remove("hidden");
        document.getElementById("select-fase").value = dadosAtuais.fase;
    }

    function limparEReiniciar() {
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
